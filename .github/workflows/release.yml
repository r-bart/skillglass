name: Repository release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: repository-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - id: tag
        name: Validate immutable release input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s LICENSE ]]; then
            echo "A chosen open-source LICENSE is required before release assembly" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag must use vMAJOR.MINOR.PATCH syntax" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "tag does not exist in this repository" >&2
            exit 1
          }
          PACKAGE_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "tag $RELEASE_TAG does not match desktop version $PACKAGE_VERSION" >&2
            exit 1
          fi
          COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

  release-draft:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - name: Create or validate the draft repository release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft >/tmp/forge-release-draft 2>/dev/null; then
            if [[ "$(</tmp/forge-release-draft)" != "true" ]]; then
              echo "Refusing to mutate an already-published release" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "Forge $RELEASE_TAG" \
              --notes "Builds have no OS-trusted publisher identity; the macOS ad-hoc signature is not Developer ID or notarization. Verify SHA256SUMS.txt before running. Forge has no automatic updater; future versions are distributed only through this repository's Releases page."
          fi

  build:
    needs: [validate, release-draft]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install Linux maker prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot rpm xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm make
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Electron E2E and packaged SQLite reopen smoke
        if: runner.os != 'Linux'
        env:
          FORGE_E2E_SKIP_PACKAGE: "1"
        run: pnpm test:e2e
      - name: Electron E2E and packaged SQLite reopen smoke (Xvfb)
        if: runner.os == 'Linux'
        env:
          FORGE_E2E_SKIP_PACKAGE: "1"
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" pnpm test:e2e
      - name: Verify native maker artifacts
        run: node --experimental-strip-types tests/e2e/support/verify-make-artifacts.ts
      - name: Select public release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: >-
          node .github/scripts/release-assets.mjs collect
          --source apps/desktop/out/make
          --destination release-assets
          --platform "$RELEASE_PLATFORM"
          --tag "$RELEASE_TAG"
          --commit "$RELEASE_COMMIT"
      - name: Attach native assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -print0 | sort -z | xargs -0 gh release upload "$RELEASE_TAG" --clobber

  finalize-draft:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - name: Download assets from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          gh release download "$RELEASE_TAG"
          --dir release-assets
          --pattern 'forge-*'
          --pattern 'target-*'
      - name: Create checksums and build metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: >-
          node .github/scripts/release-assets.mjs manifest
          --directory release-assets
          --tag "$RELEASE_TAG"
          --commit "$RELEASE_COMMIT"
          --run-id "$GITHUB_RUN_ID"
      - name: Attach aggregate checksums and build metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
            echo "Refusing to mutate an already-published release" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" release-assets/SHA256SUMS.txt release-assets/build-metadata.json --clobber
